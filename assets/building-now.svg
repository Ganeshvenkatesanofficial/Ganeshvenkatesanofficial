<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">What Ganesh Venkatesan is building now</title>
  <desc id="desc">DeskMate and A2A Healthcare Contact Center Systems are core strategic anchors. DeskMate is a privacy-first local desktop copilot powered by Flutter, FastAPI, Ollama and SmolAgents. A2A Contact Center delivers verifiable multi-agent triage, clinical intake, and compliance-first agent orchestration. The active public frontier features DeskMate, LangGraph_ArgoCD, agent-runtime, VerdexAI, Prep, and dev portfolio.</desc>
  <defs>
    <style>
      .private-signal { stroke-dasharray: 7 10; animation: building-flow 2.8s linear infinite; }
      .private-orbit { transform-box: fill-box; transform-origin: center; animation: private-orbit 18s linear infinite; }
      .private-pulse { transform-box: fill-box; transform-origin: center; animation: private-pulse 4.6s cubic-bezier(.16,1,.3,1) infinite; }
      .private-pulse.delay { animation-delay: 2.3s; }
      .frontier-page { opacity: 0; }
      .frontier-page-1 { animation: frontier-page-one 16s cubic-bezier(.16,1,.3,1) infinite; }
      .frontier-page-2 { animation: frontier-page-two 16s cubic-bezier(.16,1,.3,1) infinite; }
      .frontier-progress { transform-box: fill-box; transform-origin: left; animation: frontier-progress 8s linear infinite; }
      @keyframes building-flow { to { stroke-dashoffset: -34; } }
      @keyframes private-orbit { to { transform: rotate(360deg); } }
      @keyframes private-pulse { 0% { opacity: .46; transform: scale(.65); } 72%, 100% { opacity: 0; transform: scale(1.35); } }
      @keyframes frontier-page-one { 0%, 43% { opacity: 1; transform: translateY(0); } 48%, 95% { opacity: 0; transform: translateY(-12px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes frontier-page-two { 0%, 43% { opacity: 0; transform: translateY(12px); } 48%, 95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-12px); } }
      @keyframes frontier-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .private-signal, .private-orbit, .private-pulse, .frontier-page, .frontier-row, .frontier-progress { animation: none; opacity: 1; transform: none; }
        .private-pulse { display: none; }
        .frontier-page-1 { opacity: 1; }
        .frontier-page-2 { opacity: 0; }
      }
    </style>
    <linearGradient id="building-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.65" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#EBF1F8"/>
    </linearGradient>
    <linearGradient id="building-rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#087F80"/>
      <stop offset="0.52" stop-color="#2159E8"/>
      <stop offset="1" stop-color="#7254B3"/>
    </linearGradient>
    <radialGradient id="building-glow">
      <stop stop-color="#087F80" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#087F80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="410" rx="28" fill="url(#building-canvas)"/>
  <rect x="1" y="1" width="1198" height="408" rx="27" fill="none" stroke="#D9E2ED" stroke-width="1.5"/>
  <rect x="42" y="30" width="66" height="4" rx="2" fill="url(#building-rule)"/>
  <text x="42" y="67" fill="#14253E" font-family="Avenir Next,Segoe UI,sans-serif" font-size="27" font-weight="780">BUILDING, NOW</text>
  <text x="1158" y="66" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11.5" text-anchor="end">GANESH VENKATESAN · A2A &amp; ADK AGENT ARCHITECTURES</text>

  <g transform="translate(42 103)" font-family="Avenir Next,Segoe UI,sans-serif">
    <g transform="translate(0 0)">
      <rect width="410" height="117" rx="20" fill="#E6F7F7" stroke="#087F80" stroke-opacity="0.5"/>
      <circle cx="348" cy="58" r="72" fill="url(#building-glow)"/>
      <text x="22" y="27" fill="#087F80" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9.5" font-weight="700" letter-spacing="1.35">STRATEGIC ANCHOR · LOCAL AI</text>
      <text x="22" y="62" fill="#14253E" font-size="28" font-weight="830">DeskMate</text>
      <text x="22" y="84" fill="#526177" font-size="12" font-weight="600">Privacy-first desktop copilot powered by Ollama &amp; SmolAgents.</text>
      <text x="22" y="104" fill="#087F80" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9.5" font-weight="700">100% OFFLINE · FLUTTER + FASTAPI · OPEN SOURCE</text>
      <circle class="private-pulse" cx="354" cy="57" r="31" fill="none" stroke="#087F80" stroke-opacity=".42"/>
      <circle class="private-orbit" cx="354" cy="57" r="25" fill="none" stroke="#087F80" stroke-opacity=".34" stroke-dasharray="4 8"/>
      <path class="private-signal" d="M324 42 H363 V76 H337" fill="none" stroke="#087F80" stroke-width="1.5"/>
    </g>
    <g transform="translate(0 129)">
      <rect width="410" height="117" rx="20" fill="#F2EFFC" stroke="#7254B3" stroke-opacity="0.5"/>
      <text x="22" y="27" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9.5" font-weight="700" letter-spacing="1.35">STRATEGIC ANCHOR · HEALTHCARE &amp; CONTACT CENTER</text>
      <text x="22" y="62" fill="#14253E" font-size="28" font-weight="830">A2A Contact Center</text>
      <text x="22" y="84" fill="#526177" font-size="12" font-weight="600">Multi-agent A2A workflows for contact center triage &amp; intake.</text>
      <text x="22" y="104" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9.5" font-weight="700">HEALTHCARE AI · VERIFIABLE TRIAGE · HIPAA COMPLIANT</text>
      <circle class="private-pulse delay" cx="354" cy="57" r="31" fill="none" stroke="#7254B3" stroke-opacity=".44"/>
      <circle class="private-orbit" cx="354" cy="57" r="25" fill="none" stroke="#7254B3" stroke-opacity=".42" stroke-dasharray="3 7"/>
      <path class="private-signal" d="M334 57 L346 69 L373 42" fill="none" stroke="#7254B3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(494 103)" font-family="Avenir Next,Segoe UI,sans-serif">
    <text x="0" y="14" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="700" letter-spacing="1.6">PUBLIC FRONTIER / 6 ACTIVE PROJECTS</text>

    <g class="frontier-page frontier-page-1">
      <text x="642" y="14" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">VIEW 1 / 2</text>

      <g class="frontier-row frontier-row-1">
        <text x="0" y="61" fill="#087F80" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">01</text>
        <text x="66" y="60" fill="#14253E" font-size="20" font-weight="780">DeskMate</text>
        <text x="642" y="58" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">16 MERGED PRS · DART &amp; PYTHON · MIT</text>
        <text x="66" y="74" fill="#526177" font-size="11.5">Free, privacy-first local AI desktop copilot &amp; personal assistant.</text>
        <text x="66" y="90" fill="#526177" font-size="11.5">Runs 100% offline on macOS &amp; Windows with dual-agent backend.</text>
        <line x1="0" y1="108" x2="642" y2="108" stroke="#D9E2ED"/>
      </g>
      <g class="frontier-row frontier-row-2">
        <text x="0" y="143" fill="#9A6217" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">02</text>
        <text x="66" y="142" fill="#14253E" font-size="20" font-weight="780">LangGraph_ArgoCD</text>
        <text x="642" y="140" fill="#9A6217" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" font-weight="700" text-anchor="end">PYTHON · GITOPS ENGINE · ACTIVE</text>
        <text x="66" y="156" fill="#526177" font-size="11.5">Automated GitOps deployment and cluster operations managed</text>
        <text x="66" y="172" fill="#526177" font-size="11.5">through stateful, multi-agent LangGraph workflows.</text>
        <line x1="0" y1="190" x2="642" y2="190" stroke="#D9E2ED"/>
      </g>
      <g class="frontier-row frontier-row-3">
        <text x="0" y="225" fill="#2159E8" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">03</text>
        <text x="66" y="224" fill="#14253E" font-size="20" font-weight="780">agent-runtime</text>
        <text x="642" y="222" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">PYTHON · MCP PROTOCOL · SANDBOX</text>
        <text x="66" y="238" fill="#526177" font-size="11.5">High-performance agent harness supporting Model Context</text>
        <text x="66" y="254" fill="#526177" font-size="11.5">Protocol (MCP), dynamic tool calling, and execution sandboxes.</text>
        <line x1="0" y1="272" x2="642" y2="272" stroke="#D9E2ED"/>
      </g>
    </g>
    <g class="frontier-page frontier-page-2">
      <text x="642" y="14" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">VIEW 2 / 2</text>

      <g class="frontier-row frontier-row-1">
        <text x="0" y="61" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">04</text>
        <text x="66" y="60" fill="#14253E" font-size="20" font-weight="780">VerdexAI</text>
        <text x="642" y="58" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">PYTHON · CLINICAL RAG · VECTOR DB</text>
        <text x="66" y="74" fill="#526177" font-size="11.5">Production-grade Retrieval-Augmented Generation pipeline</text>
        <text x="66" y="90" fill="#526177" font-size="11.5">combining dense vector search with precise citation grounding.</text>
        <line x1="0" y1="108" x2="642" y2="108" stroke="#D9E2ED"/>
      </g>
      <g class="frontier-row frontier-row-2">
        <text x="0" y="143" fill="#087F80" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">05</text>
        <text x="66" y="142" fill="#14253E" font-size="20" font-weight="780">A2A &amp; ADK Core</text>
        <text x="642" y="140" fill="#087F80" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">CLINICAL TRIAGE · A2A &amp; ADK SPEC</text>
        <text x="66" y="156" fill="#526177" font-size="11.5">Agent-to-Agent (A2A) and Agent Development Kit (ADK) protocols</text>
        <text x="66" y="172" fill="#526177" font-size="11.5">binding clinical triage, EHR grounding, and doctor escalation.</text>
        <line x1="0" y1="190" x2="642" y2="190" stroke="#D9E2ED"/>
      </g>
      <g class="frontier-row frontier-row-3">
        <text x="0" y="225" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700">06</text>
        <text x="66" y="224" fill="#14253E" font-size="20" font-weight="780">Developer Portfolio</text>
        <text x="642" y="222" fill="#7254B3" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">LIVE AT GANESHDEVPORTFOLIO</text>
        <text x="66" y="238" fill="#526177" font-size="11.5">Modern, high-performance web showcase featuring real-world</text>
        <text x="66" y="254" fill="#526177" font-size="11.5">agentic demos, A2A integrations, and production case studies.</text>
        <line x1="0" y1="272" x2="642" y2="272" stroke="#D9E2ED"/>
      </g>
    </g>
  </g>

  <text x="42" y="383" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5">SIGNALS: A2A PROTOCOLS · CONTACT CENTER BENCHMARKS · HEALTHCARE COMPLIANCE · CODE</text>
  <text x="1158" y="383" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" text-anchor="end">2 ANCHORS · 6 ACTIVE REPOSITORIES · ROTATES 8 SEC</text>
  <rect x="494" y="396" width="664" height="2" rx="1" fill="#E2E8F0"/><rect class="frontier-progress" x="494" y="396" width="664" height="2" rx="1" fill="url(#building-rule)"/>
</svg>
