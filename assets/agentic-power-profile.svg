  <rect width="1200" height="690" rx="28" fill="url(#ap-bg)"/>
  <rect x="1" y="1" width="1198" height="688" rx="27" fill="none" stroke="#D9E2ED" stroke-width="1.5"/>
  <rect x="42" y="30" width="72" height="4" rx="2" fill="url(#ap-line)"/>
  <text x="42" y="65" fill="#14253E" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="780">AGENTIC ENGINEERING PROFILE</text>
  <text x="1158" y="64" fill="#526177" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" text-anchor="end">A2A · ADK · MULTI-AGENT SYSTEMS · 2026</text>

  <!-- Top Metric Cards -->
