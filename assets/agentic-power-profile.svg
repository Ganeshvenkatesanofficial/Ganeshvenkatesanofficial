    <rect class="ap-bar" style="animation-delay:0.56s" x="1065" y="320" width="50" height="220" rx="8" fill="#087F80" fill-opacity="0.28" stroke="#087F80" stroke-opacity="0.8"/>
    <circle class="ap-point" style="animation-delay:0.98s" cx="1090" cy="320" r="6" fill="#087F80" stroke="#FFFFFF" stroke-width="3"/>
    
