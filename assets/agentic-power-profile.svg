<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering Profile for Ganesh Venkatesan</title>
  <desc id="desc">Engineering velocity across A2A, ADK, and core agent architectures since March 2026: 16 merged DeskMate PRs, v1.0.0 offline copilot release, and verified CI/CD pipelines.</desc>
  <defs>
    <style>
      .ap-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line 1.8s ease-out forwards; }
      .ap-bar { opacity: 1; animation: breathe-bar 4s ease-in-out infinite; }
      .ap-point { animation: point-pulse 3s ease-in-out infinite; }
      @keyframes draw-line { to { stroke-dashoffset: 0; } }
      @keyframes breathe-bar { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes point-pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ap-line, .ap-bar, .ap-point { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="ap-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#087F80"/>
      <stop offset="0.52" stop-color="#2159E8"/>
      <stop offset="1" stop-color="#7254B3"/>
    </linearGradient>
    <linearGradient id="ap-area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2159E8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2159E8" stop-opacity="0"/>
    </linearGradient>
