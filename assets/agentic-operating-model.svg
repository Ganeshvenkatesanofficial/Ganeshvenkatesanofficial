<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ganesh Venkatesan's Agentic Operating Model: A2A Contact Center &amp; Healthcare AI</title>
  <desc id="desc">Human direction guides clinical goals and constraints through delegation, A2A multi-agent orchestration, healthcare EHR retrieval, and verified resolution.</desc>
  <defs>
    <style>
      .flow-rail { stroke-dasharray: 10 12; animation: flow 2.4s linear infinite; }
      .stage-border, .stage-node { animation: activate 8s ease-in-out infinite; }
      .stage-2 { animation-delay: 2s; }
      .stage-3 { animation-delay: 4s; }
      .stage-4 { animation-delay: 6s; }
      .gate-pulse { animation: pulse 2.8s ease-in-out infinite; }
      .gate-pulse.delay { animation-delay: 1.4s; }
      @keyframes flow { to { stroke-dashoffset: -44; } }
      @keyframes activate { 0%, 18%, 100% { opacity: .75; } 7%, 11% { opacity: 1; filter: drop-shadow(0 2px 8px rgba(33,89,232,0.2)); } }
      @keyframes pulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow-rail, .stage-border, .stage-node, .gate-pulse { animation: none; opacity: 1; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.65" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#EBF1F8"/>
    </linearGradient>
    <linearGradient id="rail" x1="102" y1="0" x2="1098" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2159E8"/>
      <stop offset="0.34" stop-color="#087F80"/>
      <stop offset="0.68" stop-color="#7254B3"/>
      <stop offset="1" stop-color="#9A6217"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#D9E2ED" stroke-width="1.5"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="62" y="56" fill="#087F80" font-size="13" font-weight="700" letter-spacing="3.3">AGENTIC OPERATING MODEL</text>
    <text x="1138" y="56" text-anchor="end" fill="#64748B" font-size="11" letter-spacing="1.4">A2A CONTACT CENTER &amp; HEALTHCARE AI</text>
  </g>

  <text x="62" y="108" fill="#14253E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="750" letter-spacing="-0.7">Direct goals. Multiply execution. Verify outcomes.</text>
  <text x="62" y="143" fill="#526177" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">A human-directed system for turning capability into verifiable, clinical-grade agent interactions.</text>

  <g transform="translate(62 173)">
    <rect width="1076" height="56" rx="14" fill="#FFFFFF" stroke="#D9E2ED" stroke-width="1.5"/>
    <text x="24" y="23" fill="#64748B" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5">A2A THROUGHPUT</text>
    <text x="24" y="43" fill="#14253E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">verified clinical &amp; contact resolutions</text>
    <line class="flow-rail" x1="400" y1="28" x2="480" y2="28" stroke="#2159E8" stroke-width="2"/>
    <text x="500" y="35" fill="#64748B" font-family="ui-monospace, monospace" font-size="15">÷</text>
    <text x="532" y="35" fill="#14253E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">human direction &amp; review</text>
    <text x="1038" y="34" text-anchor="end" fill="#087F80" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.2">PROVABLE ACCURACY</text>
  </g>

  <path d="M120 286H1080" stroke="url(#rail)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path class="flow-rail" d="M120 286H1080" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1070 277L1081 286L1070 295" stroke="#9A6217" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(82 246)">
      <rect class="stage-border stage-1" width="238" height="154" rx="18" fill="#EBF2FE" stroke="#2159E8" stroke-opacity="0.6"/>
      <circle class="stage-node stage-1" cx="34" cy="34" r="16" fill="#2159E8"/><text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">01</text>
      <text x="62" y="40" fill="#2159E8" font-size="13" font-weight="800" letter-spacing="1.4">TRIAGE &amp; DIRECT</text>
      <text x="22" y="76" fill="#14253E" font-size="17" font-weight="750">Intake → Intent</text>
      <text x="22" y="97" fill="#14253E" font-size="17" font-weight="750">→ Safety Guardrails</text>
      <text x="22" y="124" fill="#526177" font-size="12.5">Define patient protocol, SLA,</text>
      <text x="22" y="143" fill="#526177" font-size="12.5">and doctor escalation rules.</text>
    </g>

    <g transform="translate(348 246)">
      <rect class="stage-border stage-2" width="238" height="154" rx="18" fill="#E6F7F7" stroke="#087F80" stroke-opacity="0.6"/>
      <circle class="stage-node stage-2" cx="34" cy="34" r="16" fill="#087F80"/><text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">02</text>
      <text x="62" y="40" fill="#087F80" font-size="13" font-weight="800" letter-spacing="1.4">A2A &amp; ADK FLOW</text>
      <text x="22" y="76" fill="#14253E" font-size="17" font-weight="750">A2A Protocols</text>
      <text x="22" y="97" fill="#14253E" font-size="17" font-weight="750">+ ADK &amp; LangGraph</text>
      <text x="22" y="124" fill="#526177" font-size="12.5">Coordinate triage, scheduling,</text>
      <text x="22" y="143" fill="#526177" font-size="12.5">and diagnostic agent teams.</text>
    </g>

    <g transform="translate(614 246)">
      <rect class="stage-border stage-3" width="238" height="154" rx="18" fill="#F2EFFC" stroke="#7254B3" stroke-opacity="0.6"/>
      <circle class="stage-node stage-3" cx="34" cy="34" r="16" fill="#7254B3"/><text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">03</text>
      <text x="62" y="40" fill="#7254B3" font-size="13" font-weight="800" letter-spacing="1.4">RETRIEVE</text>
      <text x="22" y="76" fill="#14253E" font-size="17" font-weight="750">EHR + Clinical RAG</text>
      <text x="22" y="97" fill="#14253E" font-size="17" font-weight="750">+ MCP Tools</text>
      <text x="22" y="124" fill="#526177" font-size="12.5">Ground answers in medical records</text>
      <text x="22" y="143" fill="#526177" font-size="12.5">and verified institutional data.</text>
    </g>

    <g transform="translate(880 246)">
      <rect class="stage-border stage-4" width="238" height="154" rx="18" fill="#FEF6EC" stroke="#9A6217" stroke-opacity="0.6"/>
      <circle class="stage-node stage-4" cx="34" cy="34" r="16" fill="#9A6217"/><text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">04</text>
      <text x="62" y="40" fill="#9A6217" font-size="13" font-weight="800" letter-spacing="1.4">RESOLVE</text>
      <text x="22" y="76" fill="#14253E" font-size="17" font-weight="750">Audited Handoff</text>
      <text x="22" y="97" fill="#14253E" font-size="17" font-weight="750">+ Deterministic Action</text>
      <text x="22" y="124" fill="#526177" font-size="12.5">Deliver compliant resolutions,</text>
      <text x="22" y="143" fill="#526177" font-size="12.5">case notes, and receipts.</text>
    </g>
  </g>

  <g transform="translate(62 426)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect width="512" height="55" rx="14" fill="#FFFFFF" stroke="#2159E8" stroke-opacity="0.35"/>
    <circle class="gate-pulse" cx="28" cy="27" r="7" fill="#2159E8" filter="url(#glow)"/>
    <text x="48" y="23" fill="#2159E8" font-size="10" font-weight="700" letter-spacing="1.6">CLINICAL &amp; HUMAN AUTHORITY</text>
    <text x="48" y="41" fill="#526177" font-size="12">sets protocol · HIPAA constraints · clinical safety</text>
  </g>
  <g transform="translate(594 426)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect width="544" height="55" rx="14" fill="#FFFFFF" stroke="#087F80" stroke-opacity="0.35"/>
    <circle class="gate-pulse delay" cx="28" cy="27" r="7" fill="#087F80" filter="url(#glow)"/>
    <text x="48" y="23" fill="#087F80" font-size="10" font-weight="700" letter-spacing="1.6">EVIDENCE GATE</text>
    <text x="48" y="41" fill="#526177" font-size="12">only verified, grounded clinical actions reach the record</text>
  </g>
</svg>
