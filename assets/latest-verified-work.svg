<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="latest-title latest-desc">
  <title id="latest-title">Latest verified work by Ganesh Venkatesan</title>
  <desc id="desc">Latest pull requests, releases, and architecture updates from Ganesh Venkatesan's public GitHub repositories.</desc>
  <defs>
    <style>
      .latest-node { animation: latest-pulse 4.8s ease-in-out infinite; }
      .latest-node.delay-1 { animation-delay: .8s; }
      .latest-node.delay-2 { animation-delay: 1.6s; }
      .latest-scan { animation: latest-scan 12s linear infinite; }
      @keyframes latest-pulse { 0%,100% { opacity:.42; } 50% { opacity:1; } }
      @keyframes latest-scan { from { transform:translateY(0); } to { transform:translateY(204px); } }
      @media (prefers-reduced-motion: reduce) { .latest-node, .latest-scan { animation:none !important; } .latest-node { opacity:1; } .latest-scan { display:none; } }
    </style>
    <linearGradient id="latest-canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="latest-rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F80"/><stop offset=".52" stop-color="#2159E8"/><stop offset="1" stop-color="#7254B3"/></linearGradient>
  </defs>
  <rect width="1200" height="365" rx="28" fill="url(#latest-canvas)"/>
  <rect x="1" y="1" width="1198" height="363" rx="27" fill="none" stroke="#D9E2ED" stroke-width="1.5"/>
  <rect x="42" y="30" width="76" height="4" rx="2" fill="url(#latest-rule)"/>
  <text x="42" y="67" fill="#14253E" font-family="Avenir Next,Segoe UI,sans-serif" font-size="27" font-weight="780">LATEST VERIFIED WORK</text>
  <text x="1158" y="66" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11.5" text-anchor="end">GITHUB · LIVE PULSE · GANESHVENKATESANOFFICIAL</text>
  <line x1="76" y1="115" x2="76" y2="330" stroke="#D9E2ED" stroke-width="2"/>
  <rect class="latest-scan" x="72" y="112" width="8" height="24" rx="4" fill="#087F80" opacity=".35"/>
  <g font-family="ui-monospace,SFMono-Regular,monospace">
    <circle class="latest-node" cx="76" cy="143" r="7" fill="#087F80"/>
    <text x="113" y="128" fill="#087F80" font-size="9.5" font-weight="700" letter-spacing="1.1">LATEST MERGED DESKMATE PR</text>
    <text x="113" y="151" fill="#14253E" font-size="12.5" font-weight="680">DeskMate #16 · Streamline README, add live UI showcase,</text>
    <text x="113" y="168" fill="#14253E" font-size="12.5" font-weight="680">open-source health files, and release packaging</text>
    <text x="113" y="188" fill="#64748B" font-size="9.5">MERGED · FLUTTER + FASTAPI + SMOLAGENTS + OLLAMA</text>

    <circle class="latest-node delay-1" cx="76" cy="227" r="7" fill="#7254B3"/>
    <text x="113" y="212" fill="#7254B3" font-size="9.5" font-weight="700" letter-spacing="1.1">LATEST DESKTOP RELEASE</text>
    <text x="113" y="235" fill="#14253E" font-size="13" font-weight="680">DeskMate · Native 100% Offline Copilot v1.0.0</text>
    <text x="113" y="254" fill="#64748B" font-size="9.5">CROSS-PLATFORM · MACOS &amp; WINDOWS INSTALLER</text>

    <circle class="latest-node delay-2" cx="76" cy="298" r="7" fill="#2159E8"/>
    <text x="113" y="282" fill="#2159E8" font-size="9.5" font-weight="700" letter-spacing="1.1">LATEST A2A &amp; ADK ARCHITECTURE</text>
    <text x="113" y="306" fill="#14253E" font-size="13" font-weight="680">A2A Contact Center &amp; LangGraph Multi-Agent Protocol</text>
    <text x="113" y="325" fill="#64748B" font-size="9.5">VERIFIABLE AGENT-TO-AGENT HANDOFFS · MCP RUNTIME · HEALTHCARE COMPLIANCE</text>
  </g>
  <line x1="824" y1="110" x2="824" y2="335" stroke="#D9E2ED"/>
  <g transform="translate(866 135)" font-family="ui-monospace,SFMono-Regular,monospace">
    <text fill="#087F80" font-size="30" font-weight="780">105+</text><text y="21" fill="#526177" font-size="9.5">PUBLIC REPOSITORIES</text>
    <text y="75" fill="#7254B3" font-size="30" font-weight="780">17+</text><text y="96" fill="#526177" font-size="9.5">PULL REQUESTS</text>
    <text y="150" fill="#9A6217" font-size="30" font-weight="780">100%</text><text y="171" fill="#526177" font-size="9.5">OFFLINE PRIVACY (DESKMATE)</text>
  </g>
</svg>
